server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # This maps the URL path "/siteops/" to the physical root folder
    location /siteops/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Redirects root traffic to the /siteops/ path
    location = / {
        return 301 /siteops/;
    }

    # Standard fallback for the root path
    location / {
        try_files $uri $uri/ /index.html;
    }
}
