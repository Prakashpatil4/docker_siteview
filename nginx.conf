server {
    listen 8080;
    server_name localhost;

    # Set the base root
    root /usr/share/nginx/html;
    index index.html;

    # 1. Fix the sub-path location
    location /siteops/ {
        # Point to the specific folder where your app lives
        alias /usr/share/nginx/html/siteops/;
        # Fallback must be to /siteops/index.html
        try_files $uri $uri/ /siteops/index.html;
    }

    # 2. Redirect root traffic to /siteops/
    location = / {
        return 301 /siteops/;
    }

    # 3. Catch-all fallback
    location / {
        try_files $uri $uri/ /siteops/index.html;
    }
}
